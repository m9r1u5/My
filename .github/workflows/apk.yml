name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create Capacitor project
        run: |
          mkdir -p build/www
          cp index.html manifest.json icon-192.png icon-512.png build/www/
          cd build
          echo '{"name":"gadget-probe","private":true,"version":"1.0.0"}' > package.json
          echo '{"appId":"za.m9r1u5.gadgetprobe","appName":"Gadget Probe","webDir":"www","android":{"allowMixedContent":true}}' > capacitor.config.json
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor-community/bluetooth-le@^8
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          rm -rf build/android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-icons/* build/android/app/src/main/res/

      - name: Version and signing
        working-directory: build/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          mkdir -p ~/.android
          cp ../../signing/debug.keystore ~/.android/debug.keystore

      - name: Build
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../GadgetProbe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GadgetProbe-apk
          path: GadgetProbe.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gadget Probe 1.0.${{ github.run_number }}
          body: Download GadgetProbe.apk below and open it on your Android phone to install.
          files: GadgetProbe.apk
          make_latest: true
